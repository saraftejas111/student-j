# AWS RDS DATABASE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3307/student_db?sslMode=VERIFY_CA&serverTimezone=Asia/Kolkata
spring.datasource.username=student_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SSL TRUSTSTORE CONFIGURATION
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:///C:/Users/Abcom/Downloads/rds-truststore.p12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${TRUSTSTORE_PASSWORD}